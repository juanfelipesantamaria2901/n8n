name: Docker Production Licensed Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: soakingend38/n8n
  USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
  PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.12.1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.16'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build n8n application
      run: pnpm build:n8n

    - name: Create .env.local.production file
      run: |
        cat > .env.local.production << 'EOF'
        # Production environment configuration for n8n
        NODE_ENV=production
        N8N_LOG_LEVEL=info
        N8N_DIAGNOSTICS_ENABLED=true
        N8N_PERSONALIZATION_ENABLED=true
        N8N_VERSION_NOTIFICATIONS_ENABLED=true
        N8N_TEMPLATES_ENABLED=true
        N8N_COMMUNITY_PACKAGES_ENABLED=true
        N8N_HIDE_USAGE_PAGE=false
        EOF

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=production-licensed,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/images/n8n/Dockerfile.production-licensed
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push latest
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/images/n8n/Dockerfile.production-licensed
        push: true
        tags: |
          soakingend38/n8n:production-licensed-latest
          soakingend38/n8n:latest
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
